name: Akile Daily Check-in

on:
  schedule:
    # 每天 UTC 01:00 运行（即北京时间 09:00）
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 1. 新增：使用矩阵策略依次运行两个账号（max-parallel: 1 可避免同时并发触发风控）
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account:
          - email: ${{ secrets.AKILE_EMAIL }}
            password: ${{ secrets.AKILE_PASSWORD }}
          - email: ${{ secrets.AKILE_EMAIL_2 }}
            password: ${{ secrets.AKILE_PASSWORD_2 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 2. 修改：将矩阵中的账号密码传入脚本原本读取的环境变量中
      - name: Run Akile Check-in
        env:
          AKILE_EMAIL: ${{ matrix.account.email }}
          AKILE_PASSWORD: ${{ matrix.account.password }}
          # 如果你之前还配置了 Server酱 等推送变量，保留在下面即可，例如：
          # SENDKEY: ${{ secrets.SENDKEY }}
        run: python Akile-Checkin.py
