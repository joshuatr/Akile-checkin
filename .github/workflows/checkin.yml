name: Akile Daily Check-in

on:
  schedule:
    # 每天 UTC 01:00 运行（即北京时间 09:00）
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # 这里只写纯文本标识，不能直接放 secrets
        account:
          - email_key: AKILE_EMAIL
            pass_key: AKILE_PASSWORD
          - email_key: AKILE_EMAIL_2
            pass_key: AKILE_PASSWORD_2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 在 steps 内部使用 secrets[...] 动态读取对应的密钥
      - name: Run Akile Check-in
        env:
          AKILE_EMAIL: ${{ secrets[matrix.account.email_key] }}
          AKILE_PASSWORD: ${{ secrets[matrix.account.pass_key] }}
        run: python Akile-Checkin.py
